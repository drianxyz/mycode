      html,

      /* Tambahkan class ini di dalam tag <style> */
      .label-desa-cantik {
        background: transparent; /* Menghilangkan latar belakang kotak */
        border: none; /* Menghilangkan garis tepi kotak */
        box-shadow: none; /* Menghilangkan bayangan kotak */
        font-size: 10pt;
        font-weight: bold; /* Menebalkan huruf */
        color: #323232;
        font-family: "Arial", sans-serif; /* Font yang lebih bersih */
        text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff,
          1px 1px 0 #fff; /* Efek halo putih di sekitar teks */
        text-align: center;
        white-space: nowrap; /* Mencegah teks turun ke bawah jika sempit */
      }

      /* Style untuk Label Desa seperti Box/Tabel */
      .label-desa-box {
        background-color: rgba(
          255,
          255,
          255,
          0.9
        ); /* Latar putih agak transparan */
        border: 1px solid #444; /* Garis tepi tipis */
        border-radius: 4px; /* Sudut melengkung */
        box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); /* Efek bayangan agar timbul */
        padding: 2px 6px; /* Jarak teks ke garis tepi */
        font-family: "Helvetica", Arial, sans-serif;
        font-size: 11px;
        font-weight: bold;
        color: #000;
        text-align: center;
        white-space: nowrap; /* Mencegah teks turun baris */
        pointer-events: none; /* Agar label tidak menghalangi klik peta */
      }
      /* Style Label Balai Desa: Tanpa Kotak, Hanya Teks dengan Halo Putih */
      .label-balai-desa-clean {
        background: transparent; /* Transparan, tidak ada kotak */
        border: none;
        box-shadow: none;
        font-family: "Helvetica", Arial, sans-serif; /* Font seragam */
        font-size: 9pt;
        font-weight: bold; /* Teks tebal agar jelas */
        color: #000; /* Warna teks hitam */
        white-space: nowrap;
        text-shadow: -1.5px -1.5px 0 #fff, 1.5px -1.5px 0 #fff,
          -1.5px 1.5px 0 #fff, 1.5px 1.5px 0 #fff; /* Efek halo putih tebal agar terbaca di peta */
      }
      /* Jika peta dalam mode zoom-jauh, sembunyikan label balai desa */
      .zoom-jauh .label-balai-desa-clean {
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.2s; /* Efek transisi halus */
      }

      // remove popup's row if "visible-with-data"
      function removeEmptyRowsFromPopupContent(content, feature) {
        var tempDiv = document.createElement("div");
        tempDiv.innerHTML = content;
        var rows = tempDiv.querySelectorAll("tr");
        for (var i = 0; i < rows.length; i++) {
          var td = rows[i].querySelector("td.visible-with-data");
          var key = td ? td.id : "";
          if (
            td &&
            td.classList.contains("visible-with-data") &&
            feature.properties[key] == null
          ) {
            rows[i].parentNode.removeChild(rows[i]);
          }
        }
        return tempDiv.innerHTML;
      }
      // modify popup if contains media
      function addClassToPopupIfMedia(content, popup) {
        var tempDiv = document.createElement("div");
        tempDiv.innerHTML = content;
        var imgTd = tempDiv.querySelector("td img");
        if (imgTd) {
          var src = imgTd.getAttribute("src");
          if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
            popup._contentNode.classList.add("media");
            setTimeout(function () {
              popup.update();
            }, 10);
          } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
            var audio = document.createElement("audio");
            audio.controls = true;
            audio.src = src;
            imgTd.parentNode.replaceChild(audio, imgTd);
            popup._contentNode.classList.add("media");
            setTimeout(function () {
              popup.setContent(tempDiv.innerHTML);
              popup.update();
            }, 10);
          } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
            var video = document.createElement("video");
            video.controls = true;
            video.src = src;
            video.style.width = "400px";
            video.style.height = "300px";
            video.style.maxHeight = "60vh";
            video.style.maxWidth = "60vw";
            imgTd.parentNode.replaceChild(video, imgTd);
            popup._contentNode.classList.add("media");
            // Aggiorna il popup quando il video carica i metadati
            video.addEventListener("loadedmetadata", function () {
              popup.update();
            });
            setTimeout(function () {
              popup.setContent(tempDiv.innerHTML);
              popup.update();
            }, 10);
          } else {
            popup._contentNode.classList.remove("media");
          }
        } else {
          popup._contentNode.classList.remove("media");
        }
      }

        layer.on({

        var popupContent =

                        <td colspan="2">' +

            : "") +
          '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' +
          (feature.properties["nama"] !== null
            ? autolinker.link(
                String(feature.properties["nama"])
                  .replace(/'/g, "'")
                  .toLocaleString()
              )
            : "") +
          "</td>\
                    </tr>\
                </table>";
        var content = removeEmptyRowsFromPopupContent(popupContent, feature);
        layer.on("popupopen", function (e) {
          addClassToPopupIfMedia(content, e.popup);
        });
        layer.bindPopup(content, { maxHeight: 400 });
      }
